<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8" /> <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <title>Start</title> </head> <body> <style> \* { margin: 0; padding: 0; box-sizing: border-box; } html { min-height: 100%; } body { font-family: -apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif; min-height: 100vh; color: #f4f0e8; display: flex; justify-content: center; padding: 3rem 1.5rem; position: relative; overflow-x: hidden; } body::before { content: ''; position: fixed; inset: 0; background: url('https://i.postimg.cc/CRnR5Bwf/image.jpg') center/cover no-repeat; filter: blur(18px) saturate(120%) brightness(0.6); transform: scale(1.08); z-index: -2; } body::after { content: ''; position: fixed; inset: 0; background: rgba(10, 10, 18, 0.45); z-index: -1; } .wrap { width: 100%; max-width: 1000px; position: relative; z-index: 1; } .row { display: grid; gap: 16px; margin-bottom: 16px; align-items: stretch; } .row-2 { grid-template-columns: 1fr 1fr; } .card { background: rgba(255, 255, 255, 0.10); border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 20px; padding: 22px; backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.30); } .card h2 { font-size: 1.2rem; font-weight: 800; margin-bottom: 18px; } .search-card { display: flex; align-items: center; } .search-form { display: flex; align-items: center; gap: 8px; width: 100%; background: rgba(255, 255, 255, 0.10); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 14px; padding: 6px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18); } .search-form select { background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 10px; color: #fff; font-size: 0.8rem; font-weight: 600; padding: 8px 6px; outline: none; cursor: pointer; } .search-form select option { color: #1a1a2e; } .search-form input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 0.95rem; padding: 8px 6px; min-width: 0; } .search-form input::placeholder { color: rgba(255,255,255,0.55); } .search-form button { background: rgba(255, 255, 255, 0.20); border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 10px; color: #fff; font-size: 0.85rem; font-weight: 700; padding: 8px 14px; cursor: pointer; transition: background 0.15s; } .search-form button:hover { background: rgba(255, 255, 255, 0.35); } .icons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 22px; justify-items: center; } .icons.daily { grid-template-columns: repeat(10, 1fr); } .icons a, .icons a:link, .icons a:visited, .icons a:hover, .icons a:active { color: #fff !important; text-decoration: none !important; } .icons a { position: relative; width: 58px; height: 58px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.30); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); box-shadow: 0 4px 16px rgba(0, 0, 0, 0.20), inset 0 1px 0 rgba(255, 255, 255, 0.50), inset 0 -1px 0 rgba(255, 255, 255, 0.10); transition: transform 0.15s, box-shadow 0.15s, background 0.15s; overflow: hidden; } .icons a::before { content: ''; position: absolute; top: 0; left: 5%; width: 90%; height: 44%; border-radius: 14px 14px 50% 50%; background: linear-gradient(180deg, rgba(255,255,255,0.38) 0%, rgba(255,255,255,0.04) 100%); pointer-events: none; z-index: 1; } .icons a:hover { background: rgba(255, 255, 255, 0.16); transform: translateY(-4px) scale(1.07); box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.60), inset 0 -1px 0 rgba(255, 255, 255, 0.12); } .icons img { width: 28px; height: 28px; position: relative; z-index: 2; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.35)); } .icons .glyph { position: relative; z-index: 2; color: #fff !important; font-weight: 800; font-size: 1.1rem; letter-spacing: -0.5px; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.35); } .icons .glyph.small { font-size: 0.68rem; font-weight: 700; } @media (max-width: 720px) { .row-2 { grid-template-columns: 1fr; } .icons, .icons.daily { grid-template-columns: repeat(4, 1fr); } } </style> <div class="wrap"> <div class="row"> <div class="card search-card"> <form class="search-form" id="search-form"> <select id="engine"> <option value="https://www.google.com/search?q=" selected>Google</option> <option value="https://duckduckgo.com/?q=">DuckDuckGo</option> <option value="https://www.bing.com/search?q=">Bing</option> <option value="https://search.brave.com/search?p=">Brave</option> <option value="https://search.yahoo.com/search?p=">Yahoo</option> <option value="https://www.startpage.com/sp/search?query=">Startpage</option> </select> <input type="text" id="query" placeholder="Search..." autofocus autocomplete="off" /> <button type="submit">Go</button> </form> </div> </div> <div class="row row-2"> <div class="card"> <h2>Media</h2> <div class="icons"> <a href="https://www.youtube.com" target="\_blank" rel="noopener noreferrer" title="YouTube"><img src="https://cdn.simpleicons.org/youtube/white" alt="YouTube"></a> <a href="https://www.netflix.com" target="\_blank" rel="noopener noreferrer" title="Netflix"><img src="https://cdn.simpleicons.org/netflix/white" alt="Netflix"></a> <a href="https://www.amazon.com/primevideo" target="\_blank" rel="noopener noreferrer" title="Prime Video"><span class="glyph small">prime</span></a> <a href="https://www.viki.com" target="\_blank" rel="noopener noreferrer" title="Viki"><span class="glyph">Vi</span></a> <a href="https://www.tiktok.com" target="\_blank" rel="noopener noreferrer" title="TikTok"><img src="https://cdn.simpleicons.org/tiktok/white" alt="TikTok"></a> <a href="https://tubitv.com" target="\_blank" rel="noopener noreferrer" title="Tubi"><span class="glyph small">tubi</span></a> <a href="ht </div> </div> <div class="row"> <div class="card"> <h2>Daily</h2> <div class="icons daily"> <a href="https://miro.com" target="\_blank" rel="noopener noreferrer" title="Miro"><img src="https://cdn.simpleicons.org/miro/white" alt="Miro"></a> <a href="https://todoist.com" target="\_blank" rel="noopener noreferrer" title="Todoist"><img src="https://cdn.simpleicons.org/todoist/white" alt="Todoist"></a> <a href="https://www.amazon.com" target="\_blank" rel="noopener noreferrer" title="Amazon"><span class="glyph">a</span></a> <a href="https://shop.app" target="\_blank" rel="noopener noreferrer" title="Shop"><img src="https://cdn.simpleicons.org/shopify/white" alt="Shop"></a> <a href="https://www.ebay.com" target="\_blank" rel="noopener noreferrer" title="eBay"><img src="https://cdn.simpleicons.org/ebay/white" alt="eBay"></a> <a href="https://www.temu.com" target="\_blank" rel="noopener noreferrer" title="Temu"><span class="glyph small">temu</span></a> </div> </div> </div> </div> <script> var form = document.getElementById('search-form'); var engine = document.getElementById('engine'); var query = document.getElementById('query'); try { var saved = localStorage.getItem('searchEngine'); if (saved) engine.value = saved; } catch (e) {} engine.addEventListener('change', function () { try { localStorage.setItem('searchEngine', engine.value); } catch (e) {} }); form.addEventListener('submit', function (e) { e.preventDefault(); var q = query.value.trim(); if (q) window.open(engine.value + encodeURIComponent(q), '\_blank'); query.value = ''; }); document.querySelectorAll('.icons img').forEach(function (img) { function useGlyph() { var a = img.closest('a'); var span = document.createElement('span'); span.className = 'glyph'; span.textContent = (a.title || '?').charAt(0); img.replaceWith(span); } img.onerror = useGlyph; if (img.complete && img.naturalWidth === 0) useGlyph(); }); </script> </body> </html>
